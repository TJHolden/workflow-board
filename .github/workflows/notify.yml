name: Board notifications

on:
  schedule:
    # Every 60 minutes. GitHub runs cron on a best-effort basis, so expect
    # some drift, especially at busy times of the hour.
    - cron: '*/60 * * * *'
  workflow_dispatch:
    # Lets you run it by hand from the Actions tab, which is how to test it.
    inputs:
      dry_run:
        description: 'Print the emails instead of sending them'
        type: boolean
        default: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the mail library
        run: npm install nodemailer@6 --no-save

      - name: Check the board and email tagged people
        env:
          BIN_ID: ${{ vars.BIN_ID }}
          STATE_BIN_ID: ${{ vars.STATE_BIN_ID }}
          BOARD_URL: ${{ vars.BOARD_URL }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/notify.js
